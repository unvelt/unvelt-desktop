name: build

# Three platforms from one source tree, which is the claim the desktop plan
# makes and this is what keeps it true. Windows is developed on and tested
# locally; macOS and Linux are compiled nowhere else, so a `cfg` that only
# builds on the author's machine has to fail here rather than at release time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # The app links GTK and WebKit through Tauri, so clippy fails at
      # `glib-sys` long before it reaches any of our code. release.yml had
      # this and build.yml did not, which is why every run on Linux failed on
      # a missing .pc file rather than on anything we wrote.
      - name: Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev             librsvg2-dev patchelf libxdo-dev

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      # The probe is the honest smoke test: it exercises every backend call on
      # a real machine of that OS. A CI runner has no logged-in desktop, so it
      # must not FAIL -- but it must not hang or crash either, which is what
      # this actually checks.
      # `-p` is required: the workspace has two binaries and a bare `cargo
      # run` refuses to guess between them.
      - name: probe (must not crash)
        run: cargo run -p unvelt-agent -- --probe
        timeout-minutes: 3
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: unvelt-agent-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/unvelt-agent
            target/${{ matrix.target }}/release/unvelt-agent.exe
          if-no-files-found: error
