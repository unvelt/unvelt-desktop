name: release

# Builds the installable thing for each platform and attaches it to a tag.
#
# This exists because macOS cannot be built anywhere else here: the only
# development machine is Windows, and a .app bundle needs a Mac. Every macOS
# artifact unvelt ships comes out of this workflow.
#
# UNSIGNED, ON PURPOSE, FOR NOW
#
# No Apple Developer certificate ($99/yr) and no Azure Trusted Signing
# ($120/yr) -- see docs/desktop-plan.md §5. The costs of that are real and
# named rather than hidden: Windows shows a SmartScreen warning on first run,
# and macOS keeps a quarantine flag that Gatekeeper refuses. The Homebrew cask
# strips that flag in postflight, which is why the tap exists and why a plain
# .dmg download is the worse route.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Apple Silicon only. macos-13, the Intel runner, sat queued
          # without ever being scheduled and `publish` waits on the whole
          # matrix, so one unavailable runner held the entire release. Every
          # Mac sold since 2020 is arm64; restoring Intel is two lines if
          # somebody ever needs it.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        run: cargo tauri build --target ${{ matrix.target }}
        working-directory: crates/unvelt-app

      # The headless agent ships alongside the app. It is the thing to reach
      # for when the window is the part that is broken, and it is how a
      # machine with no desktop session collects at all.
      - name: Build the CLI
        run: cargo build --release --target ${{ matrix.target }} -p unvelt-agent

      # Split from the agent upload deliberately. Both were one step with one
      # glob, so when macOS and Linux bundled nothing the bare agent binary
      # still matched and `if-no-files-found: error` never fired -- the job
      # went green having produced no installer at all. Now an absent bundle
      # fails the build that was supposed to make it.
      - name: Installers
        uses: actions/upload-artifact@v4
        with:
          name: unvelt-installer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      # Renamed per target before upload. The release flattens every path to
      # its basename, so the macOS and Linux agents -- both plain
      # `unvelt-agent` -- collided and one silently overwrote the other. A
      # Linux user would have downloaded a Mach-O binary and been told it was
      # not executable, with nothing anywhere explaining why.
      - name: Name the agent for its platform
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ -f unvelt-agent.exe ]; then
            mv unvelt-agent.exe unvelt-agent-${{ matrix.target }}.exe
          else
            mv unvelt-agent unvelt-agent-${{ matrix.target }}
          fi

      - name: Agent
        uses: actions/upload-artifact@v4
        with:
          name: unvelt-agent-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/unvelt-agent-${{ matrix.target }}
            target/${{ matrix.target }}/release/unvelt-agent-${{ matrix.target }}.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      # The tap's cask verifies this. A cask with a stale or absent checksum
      # is a cask that installs whatever it is handed.
      # `-not -name SHA256SUMS` because the first run hashed the file it was
      # in the middle of writing and recorded the checksum of an empty one.
      - name: Checksums
        run: |
          find dist -type f -not -name SHA256SUMS | sort             | xargs shasum -a 256 | sed 's#dist/[^/]*/##' > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
          body: |
            Unsigned builds. See the README for what that costs on each
            platform, and prefer `brew install --cask unvelt/tap/unvelt` on
            macOS — the cask clears the quarantine flag that Gatekeeper
            otherwise refuses.
