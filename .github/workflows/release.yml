name: release

# Builds the installable thing for each platform and attaches it to a tag.
#
# This exists because macOS cannot be built anywhere else here: the only
# development machine is Windows, and a .app bundle needs a Mac. Every macOS
# artifact unvelt ships comes out of this workflow.
#
# UNSIGNED, ON PURPOSE, FOR NOW
#
# No Apple Developer certificate ($99/yr) and no Azure Trusted Signing
# ($120/yr) -- see docs/desktop-plan.md §5. The costs of that are real and
# named rather than hidden: Windows shows a SmartScreen warning on first run,
# and macOS keeps a quarantine flag that Gatekeeper refuses. The Homebrew cask
# strips that flag in postflight, which is why the tap exists and why a plain
# .dmg download is the worse route.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Required for Workload Identity Federation: GitHub mints a short-lived OIDC
  # token for this run, and GCP trades it for a service-account credential.
  # Nothing long-lived is stored on either side.
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Apple Silicon only. macos-13, the Intel runner, sat queued
          # without ever being scheduled and `publish` waits on the whole
          # matrix, so one unavailable runner held the entire release. Every
          # Mac sold since 2020 is arm64; restoring Intel is two lines if
          # somebody ever needs it.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The OAuth client is compiled into the binary, because an app launched
      # from Finder or the Start menu inherits no environment -- but it does
      # not live in this repository. It is read here, at build time, from the
      # same Secret Manager that already holds the database passwords and the
      # invite code, so there is one place to rotate and one place to audit.
      #
      # Keyless: GitHub mints an OIDC token for this run and GCP trades it for
      # a short-lived credential. The provider is bound to
      # `assertion.repository == 'unvelt/unvelt-desktop'`, which is the entire
      # security boundary -- without that condition any repository on GitHub
      # could mint a token for this pool.
      #
      # `unvelt-ci` can read exactly these two secrets. It cannot read the
      # database passwords or the invite code; a build has no business with
      # those.
      - id: gcp
        uses: google-github-actions/auth@v2
        with:
          project_id: compound-506422
          workload_identity_provider: projects/597664437266/locations/global/workloadIdentityPools/github/providers/unvelt-desktop
          service_account: unvelt-ci@compound-506422.iam.gserviceaccount.com

      - id: oauth
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            client_id:compound-506422/unvelt-oauth-client-id
            client_secret:compound-506422/unvelt-oauth-client-secret

      - id: signing
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            updater_key:compound-506422/unvelt-updater-key

      - name: Build
        run: cargo tauri build --target ${{ matrix.target }}
        working-directory: crates/unvelt-app
        env:
          UNVELT_BUILD_OAUTH_CLIENT_ID: ${{ steps.oauth.outputs.client_id }}
          UNVELT_BUILD_OAUTH_CLIENT_SECRET: ${{ steps.oauth.outputs.client_secret }}
          # Signs the updater artifacts. The public half is compiled into the
          # app, so an update the private key did not sign is refused -- which
          # is the only thing standing between an auto-updater and a very
          # convenient way to ship somebody else's code.
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.signing.outputs.updater_key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # The headless agent ships alongside the app. It is the thing to reach
      # for when the window is the part that is broken, and it is how a
      # machine with no desktop session collects at all.
      - name: Build the CLI
        run: cargo build --release --target ${{ matrix.target }} -p unvelt-agent
        env:
          UNVELT_BUILD_OAUTH_CLIENT_ID: ${{ steps.oauth.outputs.client_id }}
          UNVELT_BUILD_OAUTH_CLIENT_SECRET: ${{ steps.oauth.outputs.client_secret }}

      # Split from the agent upload deliberately. Both were one step with one
      # glob, so when macOS and Linux bundled nothing the bare agent binary
      # still matched and `if-no-files-found: error` never fired -- the job
      # went green having produced no installer at all. Now an absent bundle
      # fails the build that was supposed to make it.
      - name: Installers
        uses: actions/upload-artifact@v4
        with:
          name: unvelt-installer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.sig
            target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.sig
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/appimage/*.sig

      # Renamed per target before upload. The release flattens every path to
      # its basename, so the macOS and Linux agents -- both plain
      # `unvelt-agent` -- collided and one silently overwrote the other. A
      # Linux user would have downloaded a Mach-O binary and been told it was
      # not executable, with nothing anywhere explaining why.
      - name: Name the agent for its platform
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ -f unvelt-agent.exe ]; then
            mv unvelt-agent.exe unvelt-agent-${{ matrix.target }}.exe
          else
            mv unvelt-agent unvelt-agent-${{ matrix.target }}
          fi

      - name: Agent
        uses: actions/upload-artifact@v4
        with:
          name: unvelt-agent-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/unvelt-agent-${{ matrix.target }}
            target/${{ matrix.target }}/release/unvelt-agent-${{ matrix.target }}.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      # The tap's cask verifies this. A cask with a stale or absent checksum
      # is a cask that installs whatever it is handed.
      # The manifest the installed app polls. Generated from the signatures
      # the build actually produced -- a hand-written one would drift from the
      # artifacts the moment a platform's bundle name changed, and the failure
      # would be silent: the updater would simply never find an update.
      - name: Build latest.json
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          base = ("https://github.com/unvelt/unvelt-desktop/releases/download/%s/" % tag)
          # Tauri asks for a platform key it chooses, not one we invent.
          want = {
              "windows-x86_64": (".exe", "nsis"),
              "darwin-aarch64": (".tar.gz", "macos"),
              "linux-x86_64": (".AppImage", "appimage"),
          }
          files = list(pathlib.Path("dist").rglob("*"))
          platforms = {}
          for key, (suffix, _kind) in want.items():
              sig = next((f for f in files if f.name.endswith(suffix + ".sig")), None)
              art = next((f for f in files if f.name.endswith(suffix)), None)
              if not sig or not art:
                  print("no artifact for", key)
                  continue
              platforms[key] = {
                  "signature": sig.read_text().strip(),
                  "url": base + art.name,
              }
          if not platforms:
              raise SystemExit("latest.json would list no platforms; refusing to publish it")
          out = {
              "version": version,
              "notes": "See the release notes.",
              "pub_date": __import__("datetime").datetime.utcnow().isoformat() + "Z",
              "platforms": platforms,
          }
          pathlib.Path("dist/latest.json").write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY

      # `-not -name SHA256SUMS` because the first run hashed the file it was
      # in the middle of writing and recorded the checksum of an empty one.
      - name: Checksums
        run: |
          find dist -type f -not -name SHA256SUMS | sort             | xargs shasum -a 256 | sed 's#dist/[^/]*/##' > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
          body: |
            Unsigned builds. See the README for what that costs on each
            platform, and prefer `brew install --cask unvelt/tap/unvelt` on
            macOS — the cask clears the quarantine flag that Gatekeeper
            otherwise refuses.
