<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>unvelt</title>
<style>
  /* System fonts only. This window opens with no network and often before
     anything else has loaded; a webfont here would mean a flash of nothing
     followed by a reflow, every time, to buy a typeface nobody opened this
     panel to look at. */
  :root {
    --bg: #f6f7f6;
    --panel: #ffffff;
    --ink: #16211f;
    --muted: #5c6b68;
    --line: #dfe5e3;
    --accent: #10635a;
    --on: #1f8a72;
    --off: #b4641f;
    --dim: #98a5a2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1413;
      --panel: #151d1c;
      --ink: #e6ecea;
      --muted: #93a3a0;
      --line: #24302e;
      --accent: #7fd1c4;
      --on: #61c9ac;
      --off: #d99a53;
      --dim: #5a6866;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 20px 22px 28px;
  }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  .ver { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .did {
    color: var(--muted); font-size: 12px; margin-bottom: 18px;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }

  /* The coverage ribbon from the product's own vocabulary, used here as the
     one piece of state that has to read at a glance from across a desk. */
  .state {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;
  }
  .ribbon { width: 6px; height: 40px; border-radius: 3px; background: var(--on); flex: none; }
  .ribbon.paused { background: var(--off); }
  .ribbon.blocked { background: var(--dim); }
  .state h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .state p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }

  section { margin-bottom: 16px; }
  h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--dim); margin: 0 0 8px; font-weight: 600;
  }
  dl {
    margin: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
  }
  .row {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 8px 14px; border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  dt { color: var(--muted); flex: none; }
  dd {
    margin: 0; text-align: right; font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 12.5px;
  }
  /* A probe the OS refuses to answer is a fact about the machine, not a zero
     to paper over -- so it renders as an explicit em dash, in the dim colour,
     and never as 0 or false. */
  dd.none { color: var(--dim); font-style: italic; font-family: inherit; }

  .actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[disabled] { opacity: .55; cursor: default; }
  .note { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .err { color: var(--off); }
</style>
</head>
<body>
  <header>
    <h1>unvelt</h1>
    <span class="ver" id="ver"></span>
  </header>
  <div class="did" id="did"></div>

  <div class="state">
    <div class="ribbon" id="ribbon"></div>
    <div>
      <h2 id="stateTitle">Starting…</h2>
      <p id="stateSub"></p>
    </div>
  </div>

  <section>
    <h3>What this machine is doing</h3>
    <dl id="probe"></dl>
  </section>

  <section>
    <h3>Collection</h3>
    <dl id="coll"></dl>
  </section>

  <div class="actions">
    <button id="signin" class="primary" hidden>Sign in with Google</button>
    <button id="pause">Pause collection</button>
    <button id="refresh">Refresh</button>
  </div>
  <p class="note" id="note"></p>

<script type="module">
const { invoke } = window.__TAURI__.core;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// A value the platform did not give us renders as an em dash, never as 0 or
// false — the same rule the collector follows when it stays quiet rather than
// inventing a reading.
function rows(el, pairs) {
  el.innerHTML = pairs.map(([k, v]) => {
    const none = v === null || v === undefined || v === "";
    return `<div class="row"><dt>${esc(k)}</dt>` +
           `<dd class="${none ? "none" : ""}">${none ? "not available" : esc(v)}</dd></div>`;
  }).join("");
}

const bytes = (n) => n < 1024 ? `${n} B`
  : n < 1048576 ? `${(n / 1024).toFixed(1)} KB`
  : `${(n / 1048576).toFixed(1)} MB`;

function ago(ms) {
  if (!ms) return null;
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  return `${Math.round(s / 3600)}h ago`;
}

let paused = false;

async function draw() {
  const st = await invoke("status");
  paused = !st.collecting;

  $("ver").textContent = `v${st.version} · ${st.platform}`;
  $("did").textContent = `${st.device_id} · ${st.host}`;

  const ribbon = $("ribbon");
  ribbon.className = "ribbon" + (paused ? " paused" : st.signed_in ? "" : " blocked");
  if (!st.signed_in) {
    $("stateTitle").textContent = "Collecting, but not signed in";
    $("stateSub").textContent =
      "Everything is kept on this machine until you sign in. Nothing is lost.";
  } else if (paused) {
    $("stateTitle").textContent = "Paused";
    $("stateSub").textContent =
      "Nothing is being read. The gap will be recorded as one you chose.";
  } else {
    $("stateTitle").textContent = "Collecting";
    $("stateSub").textContent = `Sending to ${st.endpoint.replace(/^https?:\/\//, "")}`;
  }

  $("signin").hidden = st.signed_in;
  $("pause").textContent = paused ? "Resume collection" : "Pause collection";

  rows($("coll"), [
    ["Signed in", st.signed_in ? "yes" : "no"],
    ["Events this session", st.events_spooled],
    ["Last read", ago(st.last_tick_ms)],
    ["Last upload", ago(st.last_flush_ms)],
    ["Waiting to send", st.spool_files
      ? `${st.spool_files} batch${st.spool_files === 1 ? "" : "es"} · ${bytes(st.spool_bytes)}`
      : "nothing queued"],
  ]);

  const p = await invoke("probe");
  rows($("probe"), [
    ["Foreground app", p.app],
    ["Window title", p.title],
    ["Idle", `${p.idle_s.toFixed(0)}s`],
    ["Fullscreen", p.fullscreen === null ? null : (p.fullscreen ? "yes" : "no")],
    ["Screen locked", p.locked === null ? null : (p.locked ? "yes" : "no")],
    ["Monitors", p.monitors],
    ["Wi-Fi", p.ssid],
    ["Network", p.net],
    ["Power", p.ac === null ? null
      : `${p.ac ? "mains" : "battery"}${p.battery_pct === null ? "" : ` · ${p.battery_pct}%`}`],
  ]);
}

$("pause").addEventListener("click", async () => {
  paused = await invoke("set_paused", { paused: !paused });
  draw();
});
$("refresh").addEventListener("click", draw);
$("signin").addEventListener("click", async () => {
  const btn = $("signin");
  btn.disabled = true;
  btn.textContent = "Waiting for your browser…";
  $("note").className = "note";
  $("note").textContent = "A browser tab has opened. Pick the account you use on your phone.";
  try {
    await invoke("login");
    $("note").textContent = "";
  } catch (e) {
    $("note").className = "note err";
    $("note").textContent = String(e);
  }
  btn.disabled = false;
  btn.textContent = "Sign in with Google";
  draw();
});

draw();
// The window is usually hidden; polling only matters while someone is looking
// at it, and two seconds is faster than the collector's own five-second tick.
setInterval(() => { if (!document.hidden) draw(); }, 2000);
</script>
</body>
</html>
