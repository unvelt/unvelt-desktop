[package]
name = "unvelt-app"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
description = "The unvelt desktop app: a tray icon, a status window, and the collector running behind both."
license = "UNLICENSED"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The collector, embedded rather than supervised as a sidecar. See the note at
# the top of unvelt-agent's lib.rs for why.
unvelt-agent = { path = "../unvelt-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Second launch focuses the window that already exists instead of adding a
# second tray icon. Without it, double-clicking the exe leaves two identical
# icons and no way to tell which one is doing the work.
tauri-plugin-single-instance = "2"
# Autostart and updates are both first-party plugins. Hand-rolling either would
# mean three platform paths each -- a Run key, a LaunchAgent, a .desktop file --
# and a signature check that has to be right the first time.
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
# For the update loop's sleep. Tauri already pulls tokio in; this only asks
# for the timer.
tokio = { version = "1", features = ["time"] }
