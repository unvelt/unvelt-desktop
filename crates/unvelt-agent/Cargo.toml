[package]
name = "unvelt-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "The unvelt desktop collector: a headless agent that turns OS signals into events."
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP with rustls. Chosen over reqwest because this agent has one
# request shape and no async runtime anywhere else -- pulling in tokio to POST
# a JSONL body would be most of the binary.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[target.'cfg(windows)'.dependencies]
# windows-sys rather than the `windows` crate: this is a direct port of ctypes
# calls, so raw FFI signatures are the closer match and the smaller dependency.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
