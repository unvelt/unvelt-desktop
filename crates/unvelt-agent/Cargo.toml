[package]
name = "unvelt-agent"
version = "0.3.1"
edition = "2021"
rust-version = "1.82"
description = "The unvelt desktop collector: a headless agent that turns OS signals into events."
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP with rustls. Chosen over reqwest because this agent has one
# request shape and no async runtime anywhere else -- pulling in tokio to POST
# a JSONL body would be most of the binary.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Both notification stores are SQLite -- wpndatabase.db on Windows, usernoted's
# db on macOS. `bundled` compiles SQLite in rather than depending on whatever
# the machine happens to have, which for an agent that installs without admin
# rights is the difference between working and not. Linux has no such store, so
# it does not pay the build cost.
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
# windows-sys covers Win32, but SMTC is WinRT and only the `windows` crate
# projects it. The two coexist; this one is scoped to the media namespace so
# it does not pull in the whole surface.
windows = { version = "0.58", features = [
    "Media_Control",
    "Foundation",
    # The audio endpoints, for the output route and the peripheral signal.
    # windows-sys cannot project COM interfaces; this crate can.
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Devices_FunctionDiscovery",
    # IPropertyStore and PROPERTYKEY live here, and IMMDevice::OpenPropertyStore
    # is gated behind them.
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Foundation",
] }
# windows-sys rather than the `windows` crate: this is a direct port of ctypes
# calls, so raw FFI signatures are the closer match and the smaller dependency.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
